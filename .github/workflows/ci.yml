name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Lint, typecheck, test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm test

      - name: Build (vite)
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests (playwright)
        run: npm run e2e
        env:
          CI: true

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      # Node.js 없이 페이지를 볼 수 있게 빌드 결과를 내려받을 수 있는 파일로 남긴다.
      # Actions 실행 페이지의 Artifacts 에서 "site" 를 받아 transformer-explain.html 을 열면 된다.
      - name: Build single-file HTML
        run: npm run build:single

      - name: Upload site build (dist + single-file HTML)
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
          retention-days: 30
