name: Deploy to GitHub Pages

# main 브랜치에 푸시되면 빌드 후 GitHub Pages로 배포한다.
# 저장소 Settings → Pages → Source 를 "GitHub Actions"로 한 번 설정해야 동작한다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with repository base path
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # 배포된 사이트에서 /transformer-explain.html 로 오프라인용 단일 파일도 받을 수 있게 한다.
      - name: Build single-file HTML
        run: npm run build:single

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
